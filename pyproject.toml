[project]
name = "autopricer"
version = "0.1.0"
description = "Vehicle Buy-Price Optimiser"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly. Relying on ruff's defaults means a new ruff release
# can fail CI with no change to this repository.
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "MODEL_SOURCE=mock"
]
